[pytest]
testpaths = tests
pythonpath = .
# Bounded reruns: the shared ParaBank instance has a login/session race under parallel load (docs/notes/day12.md),
# which fails ~1-5% of runs in random UI tests. Reruns are reported in the summary line, so flakes stay visible.
addopts = -ra --alluredir=allure-results --clean-alluredir --reruns 2 --reruns-delay 1
markers =
    smoke: fast, critical-path checks
    ai: tests of AI-assisted testing features
    eval: LLM evaluation tests
    redteam: AI security / red-team tests
