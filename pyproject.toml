[project]
name = "qaforge-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "ollama>=0.6.3",
    "playwright>=1.63.0",
    "pydantic>=2.14.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "pyflakes>=4.0.3",
    "pytest-rerunfailures>=16.7",
    "pytest-xdist>=3.8.0",
]
